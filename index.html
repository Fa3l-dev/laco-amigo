<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laço Amigo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandRed: '#D93B3B', brandTeal: '#0D7A82', brandTealHover: '#095B61' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 bg-slate-50 relative overflow-x-hidden">

    <!-- TELA DE CARREGAMENTO (SPLASH SCREEN) -->
    <div id="splashScreen" class="fixed inset-0 z-50 bg-gradient-to-b from-brandTeal to-teal-900 flex flex-col items-center justify-between p-6 transition-opacity duration-700">
        <div></div>
        <div class="flex flex-col items-center text-center space-y-4">
            <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-2xl p-1 overflow-hidden animate-pulse">
                <img src="logo.png" alt="Logo Laço Amigo" class="w-full h-full object-cover rounded-full">
            </div>
            <h1 class="text-3xl font-black text-white">Laço <span class="text-brandRed">Amigo</span></h1>
            <p class="text-teal-100 text-sm">Laço amigo, um laço de cuidado</p>
            <div class="w-8 h-8 border-4 border-white/30 border-t-white rounded-full animate-spin mt-2"></div>
        </div>
        <p class="text-xs text-teal-200/80">Versão 1.0</p>
    </div>

    <!-- HEADER -->
    <header class="w-full bg-white/90 backdrop-blur-md border-b border-slate-200 px-6 py-3 sticky top-0 z-30 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center">
                <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="text-sm font-semibold text-slate-700 hidden sm:inline">Laço Amigo</span>
        </div>
        <h1 class="text-2xl font-black text-brandTeal">Laço <span class="text-brandRed">Amigo</span></h1>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow flex items-center justify-center p-4 z-10">
        <div class="max-w-lg w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8 my-4">

            <!-- LOGO CENTRAL -->
            <div class="flex flex-col items-center mb-6">
                <div class="w-20 h-20 bg-white rounded-full overflow-hidden flex items-center justify-center mb-2 shadow-sm border border-slate-100">
                    <img src="logo.png" alt="Logo Laço Amigo" class="w-full h-full object-cover">
                </div>
                <h2 id="screenTitle" class="text-xl font-black text-slate-800">Entrar no App</h2>
            </div>

            <!-- TELA INICIAL: LOGIN -->
            <form id="formLogin" class="space-y-4">
                <div>
                    <label for="loginEmail" class="block text-xs font-bold text-slate-600 mb-1">E-mail <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="email" id="loginEmail" placeholder="seuemail@exemplo.com" class="input-field pl-9" required>
                    </div>
                </div>
                <div>
                    <label for="loginSenha" class="block text-xs font-bold text-slate-600 mb-1">Senha <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" id="loginSenha" placeholder="••••••••" class="input-field pl-9" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary mt-2">Entrar</button>

                <p class="text-center text-sm font-medium text-slate-600 pt-3">
                    Ainda não tem cadastro? 
                    <button type="button" onclick="showCadastro()" class="text-brandTeal font-bold hover:underline focus:outline-none">Cadastre-se</button>
                </p>
            </form>

            <!-- TELA DE CADASTRO (INSPIRADA NO NOVO LAYOUT) -->
            <form id="formCadastro" class="space-y-3.5 hidden">
                
                <!-- Nome Completo -->
                <div>
                    <label class="form-label">Nome Completo <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="nome" placeholder="Digite seu nome completo" class="input-field pl-9" required>
                    </div>
                </div>

                <!-- E-mail -->
                <div>
                    <label class="form-label">E-mail <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="seuemail@exemplo.com" class="input-field pl-9" required>
                    </div>
                </div>

                <!-- Telefone / WhatsApp e CPF -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="form-label">Telefone / WhatsApp <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <i class="fa-solid fa-phone input-icon"></i>
                            <input type="tel" id="telefone" placeholder="(00) 00000-0000" class="input-field pl-9" required>
                        </div>
                    </div>
                    <div>
                        <label class="form-label">CPF <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <i class="fa-solid fa-address-card input-icon"></i>
                            <input type="text" id="cpf" placeholder="000.000.000-00" class="input-field pl-9" required>
                        </div>
                    </div>
                </div>

                <!-- BLOCÃO: ENDEREÇO DE RESIDÊNCIA -->
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-3">
                    <div class="flex items-center gap-1.5 text-brandTeal font-bold text-sm border-b border-slate-200/80 pb-2">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Endereço de Residência</span>
                    </div>

                    <!-- Estado e Cidade -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <div>
                            <label class="form-label">Estado (UF) <span class="text-red-500">*</span></label>
                            <select id="estado" class="input-field text-xs font-semibold" required>
                                <option value="">UF</option>
                                <option>PE</option><option>PB</option><option>AL</option><option>SP</option><option>RJ</option>
                            </select>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="form-label">Cidade <span class="text-red-500">*</span></label>
                            <input type="text" id="cidade" placeholder="Ex: São Paulo" class="input-field" required>
                        </div>
                    </div>

                    <!-- Bairro -->
                    <div>
                        <label class="form-label">Bairro <span class="text-red-500">*</span></label>
                        <input type="text" id="bairro" placeholder="Ex: Centro / Jardim das Flores" class="input-field" required>
                    </div>

                    <!-- Rua e Número -->
                    <div class="grid grid-cols-3 gap-2.5">
                        <div class="col-span-2">
                            <label class="form-label">Rua / Logradouro <span class="text-red-500">*</span></label>
                            <input type="text" id="rua" placeholder="Ex: Av. Brasil ou Rua das Acácias" class="input-field" required>
                        </div>
                        <div>
                            <label class="form-label">Nº / Casa <span class="text-red-500">*</span></label>
                            <input type="text" id="numero" placeholder="123 ou S/N" class="input-field" required>
                        </div>
                    </div>

                    <!-- Complemento -->
                    <div>
                        <label class="form-label">Complemento <span class="text-slate-400 font-normal">(Opcional)</span></label>
                        <input type="text" id="complemento" placeholder="Ex: Apto 102, Bloco B ou Próximo à praça" class="input-field">
                    </div>
                </div>

                <!-- Senha -->
                <div>
                    <label class="form-label">Senha (mínimo de 8 dígitos) <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="senha" placeholder="Crie uma senha com 8 dígitos no mínimo" class="input-field pl-9 pr-9" required minlength="8">
                        <button type="button" onclick="togglePasswordVisibility('senha')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirmar Senha -->
                <div>
                    <label class="form-label">Confirmar Senha <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirmarSenha" placeholder="Repita a mesma senha criada acima" class="input-field pl-9 pr-9" required minlength="8">
                        <button type="button" onclick="togglePasswordVisibility('confirmarSenha')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Checkboxes -->
                <div class="space-y-2 pt-1">
                    <label class="flex items-center gap-2 bg-teal-50/50 border border-teal-100 p-2.5 rounded-xl cursor-pointer text-xs font-semibold text-slate-700">
                        <input type="checkbox" class="w-4 h-4 text-brandTeal rounded border-slate-300 focus:ring-brandTeal" checked>
                        <span>Salvar minhas informações neste dispositivo para logins futuros</span>
                    </label>

                    <label class="flex items-center gap-2 border border-slate-200 p-2.5 rounded-xl cursor-pointer text-xs text-slate-600">
                        <input type="checkbox" class="w-4 h-4 text-brandTeal rounded border-slate-300 focus:ring-brandTeal" required>
                        <span>Li e concordo com os <a href="#" class="text-brandTeal font-bold underline">Termos de Uso</a> e a <a href="#" class="text-brandTeal font-bold underline">Política de Privacidade</a>. <span class="text-red-500">*</span></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary flex items-center justify-center gap-2 uppercase tracking-wide text-sm font-extrabold mt-3">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>CADASTRAR MEU PERFIL</span>
                </button>

                <p class="text-center text-sm font-medium text-slate-600 pt-2">
                    Já possui uma conta? 
                    <button type="button" onclick="showLogin()" class="text-brandTeal font-bold hover:underline focus:outline-none">Entrar agora</button>
                </p>
            </form>

            <!-- PASSO 2: SELEÇÃO DE PERFIL -->
            <section id="stepPerfil" class="hidden space-y-4">
                <div class="text-center mb-4">
                    <span class="bg-teal-100 text-brandTeal text-xs font-bold px-3 py-1 rounded-full">PASSO 2 DE 2</span>
                    <h2 class="text-xl font-black text-slate-800 mt-2">Como você deseja usar o app?</h2>
                </div>

                <button type="button" onclick="selectPerfil('Idoso')" class="card-perfil hover:border-brandTeal">
                    <div class="icon-box bg-teal-100 text-brandTeal"><i class="fa-solid fa-blind"></i></div>
                    <div>
                        <h3 class="font-extrabold text-slate-800">Sou o Idoso</h3>
                        <p class="text-xs text-slate-600">Você poderá solicitar ajuda a um ajudante.</p>
                    </div>
                </button>

                <button type="button" onclick="selectPerfil('Ajudante')" class="card-perfil hover:border-brandRed">
                    <div class="icon-box bg-red-100 text-brandRed"><i class="fa-solid fa-hand-holding-heart"></i></div>
                    <div>
                        <h3 class="font-extrabold text-slate-800">Sou Ajudante</h3>
                        <p class="text-xs text-slate-600">Você receberá as solicitações de ajuda aos idosos.</p>
                    </div>
                </button>

                <button type="button" onclick="selectPerfil('Responsável')" class="card-perfil hover:border-amber-600">
                    <div class="icon-box bg-amber-100 text-amber-600"><i class="fa-solid fa-user-shield"></i></div>
                    <div>
                        <h3 class="font-extrabold text-slate-800">Sou Responsável</h3>
                        <p class="text-xs text-slate-600">Você poderá enviar solicitações para o idoso que é responsável.</p>
                    </div>
                </button>

                <button type="button" onclick="backToCadastro()" class="w-full text-center text-xs font-bold text-slate-500 hover:text-brandTeal pt-2">
                    <i class="fa-solid fa-arrow-left"></i> Voltar ao cadastro
                </button>
            </section>

        </div>
    </main>

    <footer class="w-full bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-600 z-10">
        © 2026 Laço Amigo • Design Acessível
    </footer>

    <script src="script.js"></script>
</body>
</html>
