<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laço Amigo - Painel do Idoso</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brandRed: '#D93B3B', brandTeal: '#0D7A82', brandTealHover: '#095B61' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 antialiased bg-[#F4F8F8]">

    <header class="w-full bg-white border-b-2 border-slate-200 px-4 py-4 sm:px-8 shadow-sm sticky top-0 z-30">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-brandTeal text-white rounded-full flex items-center justify-center font-bold text-2xl shadow-sm border-2 border-teal-100">
                    👵
                </div>
                <div class="leading-tight">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-500 uppercase block">Olá, bem-vindo(a)</span>
                        <span id="headerRating" class="text-xs font-black text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">⭐ <span id="ratingVal">5.0</span></span>
                    </div>
                    <h2 id="userName" class="text-lg font-black text-slate-900">Dona Maria</h2>
                </div>
            </div>

            <button id="btnLogout" type="button" class="bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-brandRed px-4 py-2 rounded-2xl border-2 border-slate-300 font-extrabold text-sm">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
        <section class="flex justify-between items-center bg-red-50 border-2 border-red-300 p-4 rounded-3xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brandRed text-white rounded-full flex items-center justify-center text-lg animate-pulse shrink-0">
                    <i class="fa-solid fa-phone-volume"></i>
                </div>
                <div>
                    <h3 class="text-sm font-black text-red-900 uppercase">Precisa de Ajuda Imediata?</h3>
                    <p class="text-xs text-red-700 font-bold">Avisar família ou chamar socorro.</p>
                </div>
            </div>
            <button onclick="avisarFamiliaAgora()" type="button" class="bg-brandRed hover:bg-brandRedHover text-white px-4 py-2.5 rounded-2xl text-xs font-black uppercase shadow-md shrink-0">
                Avisar Família
            </button>
        </section>

        <section class="bg-white p-5 rounded-3xl border-2 border-slate-200 shadow-sm space-y-3">
            <h3 class="text-sm font-black text-slate-600 uppercase flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse text-brandRed"></i> Meu Bem-Estar Hoje
            </h3>
            <p class="text-sm font-extrabold text-slate-800">Como você está se sentindo neste momento?</p>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button type="button" onclick="updateWellness('Bem', '😊')" class="p-4 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-300 rounded-2xl flex flex-col items-center text-center">
                    <span class="text-3xl">😊</span>
                    <strong class="text-xs font-black text-emerald-900 mt-1">Estou Bem</strong>
                </button>

                <button type="button" onclick="updateWellness('Normal', '😐')" class="p-4 bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 rounded-2xl flex flex-col items-center text-center">
                    <span class="text-3xl">😐</span>
                    <strong class="text-xs font-black text-amber-900 mt-1">Estou Normal</strong>
                </button>

                <button type="button" onclick="updateWellness('Triste', '😢')" class="p-4 bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-300 rounded-2xl flex flex-col items-center text-center">
                    <span class="text-3xl">😢</span>
                    <strong class="text-xs font-black text-indigo-900 mt-1">Estou Triste</strong>
                </button>

                <button type="button" onclick="updateWellness('Preciso de atenção', '😟')" class="p-4 bg-red-50 hover:bg-red-100 border-2 border-red-300 rounded-2xl flex flex-col items-center text-center">
                    <span class="text-3xl">😟</span>
                    <strong class="text-xs font-black text-red-900 mt-1">Preciso de Atenção</strong>
                </button>
            </div>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <button type="button" onclick="solicitarAjuda('Ir à Farmácia', '💊')" class="bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md flex items-center gap-4">
                <span class="text-4xl">💊</span>
                <div class="text-left">
                    <h4 class="text-xl font-black text-slate-900">Ir à Farmácia</h4>
                    <p class="text-xs text-slate-600 font-bold mt-1">Remédios ou acompanhamento.</p>
                </div>
            </button>

            <button type="button" onclick="solicitarAjuda('Fazer Compras', '🛒')" class="bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md flex items-center gap-4">
                <span class="text-4xl">🛒</span>
                <div class="text-left">
                    <h4 class="text-xl font-black text-slate-900">Fazer Compras</h4>
                    <p class="text-xs text-slate-600 font-bold mt-1">Mercado, feira ou padaria.</p>
                </div>
            </button>

            <button type="button" onclick="solicitarAjuda('Ajuda em Casa', '🏠')" class="bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md flex items-center gap-4">
                <span class="text-4xl">🏠</span>
                <div class="text-left">
                    <h4 class="text-xl font-black text-slate-900">Ajuda em Casa</h4>
                    <p class="text-xs text-slate-600 font-bold mt-1">Pequenas tarefas domésticas.</p>
                </div>
            </button>

            <button type="button" onclick="solicitarAjuda('Acompanhante', '🏥')" class="bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md flex items-center gap-4">
                <span class="text-4xl">🏥</span>
                <div class="text-left">
                    <h4 class="text-xl font-black text-slate-900">Acompanhante</h4>
                    <p class="text-xs text-slate-600 font-bold mt-1">Consultas ou passeios.</p>
                </div>
            </button>
        </section>

        <section class="space-y-3 pt-2">
            <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-brandTeal"></i> Meus Pedidos Recentes
            </h3>
            <div id="myRequestsContainer" class="bg-white p-5 rounded-3xl border-2 border-slate-200 shadow-sm space-y-3"></div>
        </section>
    </main>

    <!-- MODAL DE AVALIAÇÃO DO IDOSO -->
    <div id="evalModalIdoso" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl border-2 border-slate-200 p-6 space-y-6 shadow-2xl text-center">
            <div class="w-16 h-16 bg-teal-100 text-brandTeal rounded-full flex items-center justify-center text-3xl mx-auto border-2 border-teal-300">
                <i class="fa-solid fa-hands-holding-child"></i>
            </div>
            <div>
                <h3 class="text-xl font-black text-slate-900">Avalie o Voluntário</h3>
                <p class="text-xs text-slate-600 font-bold mt-1">Como foi o atendimento prestado?</p>
            </div>

            <div class="flex justify-center gap-2 text-3xl cursor-pointer py-2" id="starContainerIdoso">
                <span onclick="setRatingIdoso(1)" class="starIdoso text-slate-300 hover:text-amber-400 transition-colors">★</span>
                <span onclick="setRatingIdoso(2)" class="starIdoso text-slate-300 hover:text-amber-400 transition-colors">★</span>
                <span onclick="setRatingIdoso(3)" class="starIdoso text-slate-300 hover:text-amber-400 transition-colors">★</span>
                <span onclick="setRatingIdoso(4)" class="starIdoso text-slate-300 hover:text-amber-400 transition-colors">★</span>
                <span onclick="setRatingIdoso(5)" class="starIdoso text-slate-300 hover:text-amber-400 transition-colors">★</span>
            </div>

            <button type="button" onclick="finalizarAvaliacaoIdoso()" class="w-full bg-brandTeal hover:bg-brandTealHover text-white p-3.5 rounded-2xl font-black shadow-md">
                Enviar Avaliação
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let currentUserName = 'Dona Maria';
        let currentEvalServiceId = null;
        let selectedStarsIdoso = 5;

        document.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('laco_amigo_user_session');
            if (savedData) {
                try {
                    const user = JSON.parse(savedData);
                    if (user.name) {
                        currentUserName = user.name;
                        document.getElementById('userName').textContent = user.name;
                    }
                } catch (_) {}
            }

            document.getElementById('btnLogout')?.addEventListener('click', () => {
                localStorage.removeItem('laco_amigo_user_session');
                window.location.href = 'index.html';
            });

            updateHeaderRating();
            ouvirServicosEmTempoReal(renderMeusPedidos);
        });

        function updateHeaderRating() {
            const ratings = JSON.parse(localStorage.getItem('laco_amigo_ratings_idoso') || '[5, 5]');
            const sum = ratings.reduce((a, b) => a + b, 0);
            const avg = (sum / ratings.length).toFixed(1);
            document.getElementById('ratingVal').textContent = avg;
        }

        function solicitarAjuda(servico, icone) {
            criarServicoIdoso(servico, icone, currentUserName);
            alert(`Sua solicitação de "${servico}" foi enviada aos voluntários!`);
        }

        function updateWellness(status, emoji) {
            const mensagem = `${currentUserName} atualizou o humor para: ${emoji} ${status}`;
            const tipo = status === 'Preciso de atenção' ? 'Atenção Solicitada' : 'Humor Diário';
            criarAlertaIdoso(tipo, mensagem, currentUserName);
            alert(`Seu humor "${emoji} ${status}" foi notificado ao responsável!`);
        }

        function avisarFamiliaAgora() {
            criarAlertaIdoso('EMERGÊNCIA', `${currentUserName} acionou o alerta de emergência!`, currentUserName);
            alert('Alerta urgente enviado ao responsável!');
        }

        function renderMeusPedidos(servicos) {
            const container = document.getElementById('myRequestsContainer');
            if (!servicos || servicos.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 font-bold text-center">Nenhum pedido feito hoje.</p>`;
                return;
            }

            container.innerHTML = servicos.map(item => {
                const jaAvaliou = item.avaliacaoIdosoEnviada;
                const statusTexto = item.status === 'Concluído' ? '✅ Concluído por Ambos' : item.status === 'Pendente' ? '🟡 Aguardando Voluntário' : '🔵 Em Andamento';

                return `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200 gap-3">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${item.icone}</span>
                        <div>
                            <h4 class="text-sm font-black text-slate-900">${item.servico}</h4>
                            <span class="text-[11px] text-slate-500 font-bold">${item.horario} • ${item.voluntario}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        ${item.status === 'Pendente' ? `
                            <span class="bg-amber-100 text-amber-800 text-xs font-black px-3 py-1 rounded-full border border-amber-300">🟡 Aguardando Voluntário</span>
                        ` : jaAvaliou ? `
                            <span class="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full border border-emerald-300">
                                ${item.status === 'Concluído' ? '✅ Concluído por ambos' : '✅ Você já avaliou'}
                            </span>
                        ` : `
                            <button onclick="abrirAvaliacao('${item.id}')" class="text-xs font-black text-emerald-800 bg-emerald-100 hover:bg-emerald-200 border border-emerald-300 px-3 py-1.5 rounded-full transition-all">
                                Marcar Concluído e Avaliar
                            </button>
                        `}
                    </div>
                </div>
            `}).join('');
        }

        function abrirAvaliacao(id) {
            currentEvalServiceId = id;
            setRatingIdoso(5);
            document.getElementById('evalModalIdoso').classList.remove('hidden');
        }

        function setRatingIdoso(stars) {
            selectedStarsIdoso = stars;
            const elements = document.querySelectorAll('#starContainerIdoso .starIdoso');
            elements.forEach((el, index) => {
                if (index < stars) {
                    el.classList.add('text-amber-400');
                    el.classList.remove('text-slate-300');
                } else {
                    el.classList.add('text-slate-300');
                    el.classList.remove('text-amber-400');
                }
            });
        }

        function finalizarAvaliacaoIdoso() {
            if (db && currentEvalServiceId) {
                db.ref('services/' + currentEvalServiceId).once('value', snapshot => {
                    const data = snapshot.val() || {};
                    // Se o voluntário já avaliou, define o status final como "Concluído"
                    const novoStatus = data.avaliacaoVoluntarioEnviada ? 'Concluído' : 'Concluido_Idoso';

                    db.ref('services/' + currentEvalServiceId).update({
                        status: novoStatus,
                        avaliacaoIdosoEnviada: true,
                        notaDadaPeloIdoso: selectedStarsIdoso
                    });
                });
            }

            const ratings = JSON.parse(localStorage.getItem('laco_amigo_ratings_voluntario') || '[5]');
            ratings.push(selectedStarsIdoso);
            localStorage.setItem('laco_amigo_ratings_voluntario', JSON.stringify(ratings));

            document.getElementById('evalModalIdoso').classList.add('hidden');
            alert('Você avaliou o voluntário com sucesso!');
        }
    </script>
</body>
</html>
