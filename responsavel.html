<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laço Amigo - Painel do Responsável</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#D93B3B',
                        brandTeal: '#0D7A82',
                        brandTealHover: '#095B61'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 bg-slate-50">

    <!-- SPLASH SCREEN -->
    <div id="splashScreen" class="fixed inset-0 z-50 bg-gradient-to-b from-brandTeal to-teal-900 flex flex-col items-center justify-between p-6 transition-opacity duration-700">
        <div></div>
        <div class="flex flex-col items-center text-center space-y-4">
            <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-2xl p-1 overflow-hidden animate-pulse">
                <img src="logo.jpg" alt="Logo Laço Amigo" class="w-full h-full object-cover rounded-full" onerror="this.src='https://via.placeholder.com/150'">
            </div>
            <h1 class="text-3xl font-black text-white">Laço <span class="text-brandRed">Amigo</span></h1>
            <p class="text-teal-100 text-sm">Painel do Responsável</p>
            <div class="w-8 h-8 border-4 border-white/30 border-t-white rounded-full animate-spin mt-2"></div>
        </div>
        <p class="text-xs text-teal-200/80">Versão 1.0</p>
    </div>

    <!-- HEADER -->
    <header class="w-full bg-white border-b-2 border-slate-200 px-4 py-4 sm:px-8 shadow-sm sticky top-0 z-30">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-600 text-white rounded-full flex items-center justify-center font-bold text-2xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-amber-600 uppercase tracking-wider block">Painel do Responsável</span>
                    <h2 id="userName" class="text-lg sm:text-xl font-black text-slate-900">Responsável</h2>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button id="btnLogout" type="button" class="bg-slate-100 hover:bg-red-100 text-slate-700 hover:text-brandRed p-3 rounded-2xl border-2 border-slate-300 transition-all flex items-center gap-2 font-extrabold text-sm">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden md:inline">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">

        <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-circle-info text-amber-600 text-xl"></i>
            <p class="text-sm font-bold text-amber-900">
                Você está solicitando serviços em nome do seu idoso vinculado.
            </p>
        </div>

        <div>
            <h3 class="text-xl sm:text-2xl font-black text-slate-800">
                Qual serviço deseja solicitar para o idoso?
            </h3>
            <p class="text-slate-600 text-sm font-medium mt-1">Selecione uma das opções para enviar um pedido de ajuda:</p>
        </div>

        <!-- GRADE DE OPÇÕES -->
        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <!-- 1. Farmácia -->
            <button type="button" onclick="solicitarServico('Farmácia')" class="group text-left bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md transition-all flex items-center gap-4">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-700 group-hover:bg-brandTeal group-hover:text-white rounded-2xl flex items-center justify-center text-3xl shrink-0">
                    <i class="fa-solid fa-prescription-bottle-medical"></i>
                </div>
                <div>
                    <h4 class="text-xl font-black text-slate-900">Ir à Farmácia</h4>
                    <p class="text-slate-600 text-xs font-semibold">Solicitar busca de remédios ou acompanhamento.</p>
                </div>
            </button>

            <!-- 2. Mercado -->
            <button type="button" onclick="solicitarServico('Compras')" class="group text-left bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md transition-all flex items-center gap-4">
                <div class="w-16 h-16 bg-amber-100 text-amber-700 group-hover:bg-brandTeal group-hover:text-white rounded-2xl flex items-center justify-center text-3xl shrink-0">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div>
                    <h4 class="text-xl font-black text-slate-900">Fazer Compras</h4>
                    <p class="text-slate-600 text-xs font-semibold">Ajuda para feira, padaria ou supermercado.</p>
                </div>
            </button>

            <!-- 3. Ajuda em Casa -->
            <button type="button" onclick="solicitarServico('Ajuda Doméstica')" class="group text-left bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md transition-all flex items-center gap-4">
                <div class="w-16 h-16 bg-blue-100 text-blue-700 group-hover:bg-brandTeal group-hover:text-white rounded-2xl flex items-center justify-center text-3xl shrink-0">
                    <i class="fa-solid fa-broom"></i>
                </div>
                <div>
                    <h4 class="text-xl font-black text-slate-900">Ajuda em Casa</h4>
                    <p class="text-slate-600 text-xs font-semibold">Pequenas tarefas e organização do lar.</p>
                </div>
            </button>

            <!-- 4. Acompanhante -->
            <button type="button" onclick="solicitarServico('Acompanhante')" class="group text-left bg-white p-6 rounded-3xl border-4 border-slate-200 hover:border-brandTeal shadow-md transition-all flex items-center gap-4">
                <div class="w-16 h-16 bg-purple-100 text-purple-700 group-hover:bg-brandTeal group-hover:text-white rounded-2xl flex items-center justify-center text-3xl shrink-0">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div>
                    <h4 class="text-xl font-black text-slate-900">Acompanhante</h4>
                    <p class="text-slate-600 text-xs font-semibold">Companhia para consultas ou passeios.</p>
                </div>
            </button>

        </section>

    </main>

    <footer class="w-full bg-white border-t-2 border-slate-200 py-4 text-center text-xs text-slate-600">
        © 2026 Laço Amigo • Módulo do Responsável
    </footer>

    <script>
        const STORAGE_KEY = 'laco_amigo_user_session';

        document.addEventListener('DOMContentLoaded', () => {
            // Remove Splash Screen
            const splash = document.getElementById('splashScreen');
            if (splash) {
                setTimeout(() => {
                    splash.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => splash.remove(), 700);
                }, 1500);
            }

            // Ler Sessão
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                const user = JSON.parse(savedData);
                document.getElementById('userName').textContent = user.name || user.email.split('@')[0];
            }

            // Sair
            document.getElementById('btnLogout').addEventListener('click', () => {
                localStorage.removeItem(STORAGE_KEY);
                window.location.href = 'index.html';
            });
        });

        function solicitarServico(servico) {
            alert(`Solicitação de "${servico}" registrada com sucesso para o idoso! Aguarde a confirmação de um voluntário.`);
        }
    </script>
</body>
</html>
